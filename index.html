<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>ระบบติดตามโครงการ แผนกเวชาสารสนเทศ โรงพยาบาลจันทรุเบกษา</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* อนุญาตให้เลื่อนแนวตั้งได้ แต่ล็อกไม่ให้เลื่อนซ้าย-ขวา */
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
          background: hsla(211, 36%, 46%, 1);

background: radial-gradient(circle, hsla(211, 36%, 46%, 1) 0%, hsla(215, 59%, 14%, 1) 56%);

background: -moz-radial-gradient(circle, hsla(211, 36%, 46%, 1) 0%, hsla(215, 59%, 14%, 1) 56%);

background: -webkit-radial-gradient(circle, hsla(211, 36%, 46%, 1) 0%, hsla(215, 59%, 14%, 1) 56%);

filter: progid: DXImageTransform.Microsoft.gradient( startColorstr="#4b749f", endColorstr="#0F213A", GradientType=1 );;

filter: progid: DXImageTransform.Microsoft.gradient( startColorstr="#4b749f", endColorstr="#052037", GradientType=1 );
        }

        .iframe-container {
            width: 100%;
            min-height: 100dvh;
            /* เว้นระยะปลอดภัยด้านล่างสำหรับ Home bar ของมือถือ */
            padding-bottom: env(safe-area-inset-bottom, 20px);
            display: flex;
        }

        iframe {
            width: 100%;
            /* ให้ iframe ขยายเต็มพื้นที่ความสูง หรือยืดตามเนื้อหา */
            min-height: 100dvh;
            border: none;
            display: block;
        }

        /* =========================
           Mobile
           ========================= */
        @media (max-width: 768px) {
            .iframe-container {
                /* เพิ่มระยะ padding ด้านล่างกันเมนูจม */
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
            }
        }
    </style>
</head>

<body>

    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbxe2Q7VxbBoxue-Uosg9Lj9rWTitty5tphz7OjXyxGctoLTl6qbs3dFOZGMY8H4m7xH/exec"></iframe>
    </div>

</body>
</html>
